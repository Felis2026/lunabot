max_retries: 1  # 最大重试次数
min_repeat_interval_seconds: 60  # 重复提醒允许的最短间隔
one_time_misfire_grace_seconds: 300  # 一次性提醒允许短期补发的宽限时间
one_time_retry_delay_seconds: 60  # 明确未发送时的补发间隔
one_time_max_send_retries: 4  # 初次触发失败后最多补发次数
max_active_tasks_per_user: 5  # 同一用户在全部群聊中的活跃任务上限
max_active_tasks_per_group: 30  # 单个群聊的活跃任务上限
create_rate_limit_window_seconds: 600  # 成功创建次数统计窗口
max_creations_per_window: 3  # 单个用户在统计窗口内最多成功创建数
