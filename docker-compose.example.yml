services:
  # === 服务A: Lunabot (Python 3.13) ===
  lunabot:
    env_file:
      - .env
    build:
      context: .
      args:
        # 默认使用官方镜像；网络受限时可在 .env 换成可信镜像代理。
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.13-bookworm}
        # 默认构建 StarMoe master；需要复现旧镜像时可在 .env 指定完整 commit。
        DECKREC_NATIVE_REF: ${DECKREC_NATIVE_REF:-master}
    container_name: lunabot_container
    restart: always
    volumes:
      # 1) 挂载项目目录，代码改动可即时生效
      - ./:/app
      # 2) 挂载字体目录，避免图片渲染出现方块字
      - ./fonts:/root/.fonts
    environment:
      - TZ=Asia/Shanghai
      # Preview 与正式组卡使用不同进程和数据目录，但共同运行在本容器中。
      # Bot 配置中的 cn_jp_preview.enabled 也必须同时开启。
      - DECKREC_PREVIEW_LOCAL_ENABLED=${DECKREC_PREVIEW_LOCAL_ENABLED:-0}
      # 可选：临时覆盖原生组卡 wheel 时同时配置以下三项。wheel 应放在持久挂载目录，
      # build id 必须能区分同版本号的不同构建，SHA-256 用于阻止误装或文件损坏。
      # - DECKREC_NATIVE_OVERRIDE_WHEEL=/app/data/sekai/deckrec/native-overrides/<build-id>/<wheel>.whl
      # - DECKREC_NATIVE_OVERRIDE_SHA256=<64位sha256>
      # - DECKREC_NATIVE_BUILD_ID=<build-id>
    depends_on:
      - napcat
    # 对外暴露 OneBot 反向 WS 监听端口（可用于调试）
    ports:
      - "3309:3309"
    networks:
      - your_bot_net

  # === 服务B: NapCat (QQ 接入端) ===
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat_container
    restart: always
    # 固定主机名，便于容器间排查网络问题
    hostname: napcat-bot
    environment:
      # 请在这里填写你自己的 QQ 号（示例：123456789）
      - ACCOUNT=123456789
      - WSR_ENABLE=true
      - WSR_URL=ws://lunabot:3309/onebot/v11/ws
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
      - ./data:/app/data
    ports:
      - "6099:6099"
    networks:
      - your_bot_net
    # 示例 MAC 地址，请按你的网络环境自行修改，避免与已有设备冲突
    mac_address: 02:42:AC:12:34:56

networks:
  your_bot_net:
    driver: bridge
